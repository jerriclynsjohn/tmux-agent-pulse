name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AGENT_PULSE_REAL_TMUX_TEST: '1'
      AGENT_PULSE_NOTIFY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tmux-plugins/tpm
          ref: e261deb1b47614eed3400089ce7197dc68acc4eb # Reviewed TPM master revision
          path: .test-deps/tpm
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux fzf build-essential
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install tmux fzf
      - name: Report versions
        run: |
          python3 --version
          tmux -V
          fzf --version
      - name: Unit and private tmux integration tests
        env:
          AGENT_PULSE_TPM_PATH: ${{ github.workspace }}/.test-deps/tpm
        run: python3 -m unittest discover -s tests -v
      - name: Provider lifecycle smoke test
        run: python3 tests/tmux_status_smoke.py
      - name: Shell syntax
        run: |
          bash -n agent-pulse.tmux
          for script in lib/*.sh; do bash -n "$script"; done
