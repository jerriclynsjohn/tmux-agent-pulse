# Keep this declaration before your existing TPM initialization.
set -g @plugin 'jerriclynsjohn/tmux-agent-pulse'

# These examples replace the formats. Add the icon field to an existing theme
# instead when you want to keep that theme's window labels.
set -g window-status-format '#I:#W#{@agent-pulse-window-icon}'
set -g window-status-current-format '#I:#W#{@agent-pulse-window-icon}'

# Keep your existing TPM initialization at the bottom of the configuration.
# For a local checkout without TPM, use this command instead of the declaration:
# run-shell '"/absolute/path/to/tmux-agent-pulse/agent-pulse.tmux"'
