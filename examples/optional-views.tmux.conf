# Set these before loading AgentPulse or TPM.
set -g @agent-pulse-popup-key 'a'
set -g @agent-pulse-sidebar-key 'A'
set -g @agent-pulse-sidebar-width 24
set -g @agent-pulse-interval 0.5

# Enable plain ASCII indicators for terminals without the Unicode symbols.
# set -g @agent-pulse-ascii on

# Keep this declaration before your existing TPM initialization.
set -g @plugin 'jerriclynsjohn/tmux-agent-pulse'
